
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Arena.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameScreen">
    <header>
      <h1>TANK ARENA.IO</h1>
      <div class="stats">
        <span id="level">Level 1</span>
        <span id="score">Score: 0</span>
        <span id="health">HP: 100</span>
      </div>
    </header>

    <canvas id="gameCanvas"></canvas>

    <div id="startScreen">
      <h1>TANK ARENA.IO</h1>
      <p>Destroy enemy tanks. Collect shapes. Become stronger.</p>
      <p>Move: WASD / Arrow Keys · Aim: Mouse · Shoot: Click / Space</p>
      <button id="playBtn">PLAY NOW</button>
    </div>

    <div id="upgradePanel" class="hidden">
      <h3>LEVEL UP! Choose an upgrade</h3>
      <button data-upgrade="damage">⚔ Damage</button>
      <button data-upgrade="speed">⚡ Movement Speed</button>
      <button data-upgrade="health">❤️ Max Health</button>
      <button data-upgrade="fire">🔥 Fire Rate</button>
    </div>

    <div id="gameOver" class="hidden">
      <h1>GAME OVER</h1>
      <p id="finalScore">Score: 0</p>
      <button id="againBtn">PLAY AGAIN</button>
    </div>

    <footer>
      <p>Destroy red tanks and collect glowing shapes to level up.</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
